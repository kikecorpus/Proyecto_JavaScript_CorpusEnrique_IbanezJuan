<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" 
        rel="stylesheet" 
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" 
        crossorigin="anonymous">

  <link rel="stylesheet" href="./css/style.css">
</head>

<body>
 <div class="contenedorLogin">

           <h2>Inicio de Sesion</h2>
       

        <div class="form-floating">
          <select class="form-select" id="floatingSelect" aria-label="Floating label select example">
            <option selected>Selecciona Tipo de Usuario</option>
            <option value="1">Administrador</option>
            <option value="2">Docente</option>
            <option value="3">Estudiante</option>
          </select>
          <label for="floatingSelect">Tipo de Usuario</label>
        </div>

      
        <div class="form-floating">
        <input type="email" class="form-control" id="floatingInput" placeholder="name@example.com">
        <label for="floatingInput">Usuario</label>
        </div>

        <div class="form-floating">
          <input type="password" class="form-control" id="floatingPassword" placeholder="Password">
          <label for="floatingPassword">Contraseña</label>
        </div>

        <button type="button" class="btn btn-primary botones">Ingresar</button>
</div>

<div class="animation"> 
  <img src="./recursos/img/img/sin fondo.png" alt="">

</div>

  
</body>

  <script src="./script/script.js"></script>
</html>
