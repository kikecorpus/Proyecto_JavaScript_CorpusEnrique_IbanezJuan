<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="form-modulo.css">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" 
          rel="stylesheet" 
          integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" 
          crossorigin="anonymous">

    <style>
      .btn-buttom-left {
        left: 20px;
        bottom: 20px;
        position: fixed;
        width: 20%;
      }
      .btn-buttom-right {
        right: 20px;
        bottom: 20px;
        position: fixed;
        width: 20%;
      }
      body{
        text-align: center;
      }
    </style>
</head>
<body>
 
    <h1 class="display-6">Inscripción de leccion</h1>
  
  
    <form id="formInscripcionLeccion">
    <div class="row g-2" style="margin-left: 12px; margin-right: 12px">
      
      <div class="col-md-12">
        <div class="mb-3">
          <label class="form-label">Nombre de la leccion</label>
          <input type="text" class="form-control" placeholder="Ingrese nombre de la leccion" />
        </div>
      </div>



      <div class="col-md-1">
        <div class="mb-3">
          <label class="fechita">Fecha</label>
          <input type="date" class="form-control" placeholder="Ingrese su fecha" />
        </div>
      </div>
    
      <div class="col-md-12">
        <div class="mb-3">
          <label class="form-label">Cédula</label>
          <input type="number" class="form-control" placeholder="Profesor a cargo" />
        </div>
      </div>

 

      <div class="col-md-12">
        <div class="mb-3">
          <label class="form-label">Area a tratar</label>
          <input type="text" class="form-control" placeholder="Tema a tratar" />
        </div>
      </div>

      

      <!-- Botones -->
      <button class="btn btn-secondary btn-buttom-left">Cancelar</button>
      <button type="submit" class="btn btn-primary btn-buttom-right">Aceptar</button>
    </div>
  </form>


  
    <script>
    document.getElementById("formInscripcionLe")
      .addEventListener("submit", function (event) {
        location.reload();
      });
  </script>
</body>
</html>
