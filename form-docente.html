<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="form-docente.css">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" 
          rel="stylesheet" 
          integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" 
          crossorigin="anonymous">

    <style>
      .btn-buttom-left {
        left: 20px;
        bottom: 20px;
        position: fixed;
        width: 20%;
      }
      .btn-buttom-right {
        right: 20px;
        bottom: 20px;
        position: fixed;
        width: 20%;
      }
      body{
       background-color: darkorange;
       
        text-align: center;
      }
    
    </style>
</head>
<body>
 
    <h1 class="display-6"></h1>
  
  
    <form id="docente nombre completo">
    <div class="row g-2" style="margin-left: 12px; margin-right: 12px">
      
      <div class="col-md-12">
        <div class="mb-3">
          <label class="form-label">Nombre completo</label>
          <input type="text" class="form-control" placeholder="Ingrese nombre del docente" />
        </div>
      </div>

      
    </div class="col-md-12">
      <div class="mb-3">
        <label class="form-label">"cedula de ciudadnia"</label>
        <input type="number" class="form-control" placeholder="inserte su numero de cedula" />
      </div>
    </div>



      
    
      <div class="col-md-12">
        <div class="mb-3">
          <label class="form-label">Cédula</label>
          <input type="number" class="form-control" placeholder="correo electrónico" />
        </div>
      </div>

 

      <div class="col-md-12">
        <div class="mb-3">
          <label class="form-label">area de especializacion</label>
          <input type="text" class="form-control" placeholder="area especializacion" />
        </div>
      </div>

      

      <!-- Botones -->
      <button class="btn btn-warning btn-buttom-left">Cancelar</button>
      <button type="submit" class="btn btn-warning btn-buttom-right">Aceptar</button>
    </div>
  </form>


  
    <script>
    document.getElementById("formInscripcionLe")
      .addEventListener("submit", function (event) {
        location.reload();
      });
  </script>
</body>
</html>
