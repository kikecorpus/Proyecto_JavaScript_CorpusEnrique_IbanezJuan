<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" 
          rel="stylesheet" 
          integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" 
          crossorigin="anonymous">
<link href="form-estudiantes.css"


    <style>
      .btn-buttom-left {
        left: 20px;
        bottom: 20px;
        position: fixed;
        width: 20%;
      }
      .btn-buttom-right {
        right: 20px;
        bottom: 20px;
        position: fixed;
        width: 20%;
      }
    </style>
</head>
<body>

    <h1 class="display-6">Inscripción de estudiantes</h1>
 
  
    <form id="formInscripcionEstudiante">
    <div class="row g-2" style="margin-left: 12px; margin-right: 12px">
      
      <div class="col-md-12">
        <div class="mb-3">
          <label class="form-label">Nombre completo</label>
          <input type="text" class="form-control" placeholder="Ingrese su nombre" />
        </div>
      </div>

      <div class="col-md-12">
        <div class="mb-3">
          <label class="form-label">Cédula</label>
          <input type="number" class="form-control" placeholder="Ingrese su cédula/tarjeta de identidad" />
        </div>
      </div>

      <div class="col-md-12">
        <div class="mb-3">
          <label class="form-label">Correo electrónico</label>
          <input type="email" class="form-control" placeholder="Ingrese su correo electrónico" />
        </div>
      </div>

      <div class="col-md-12">
        <div class="mb-3">
          <label class="form-label">nivel de educacion</label>
          <input type="text" class="form-control" placeholder="Ingrese el nivel de educacion del estudiante" />
        </div>
      </div>

      

      <!-- Botones -->
      <button class="btn btn-secondary btn-buttom-left">Cancelar</button>
      <button type="submit" class="btn btn-primary btn-buttom-right">Aceptar</button>
    </div>
  </form>


  
    <script>
    document.getElementById("formInscripcionEstudiantes")
      .addEventListener("submit", function (event) {
        location.reload();
      });
  </script>
</body>
</html>
